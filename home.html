<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公式恋愛詩人 咲華 - 公式詩集</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    :root {
      --bg-dark: #0d1124;
      --card-bg: #161c36;
      --accent-gold: #e5b95f;
      --accent-pink: #ffb7c5;
      --text-light: #f3f4f6;
      --text-sub: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.8;
      padding-bottom: 60px;
    }
    header {
      text-align: center;
      padding: 40px 20px 20px;
      background: linear-gradient(180deg, #182042 0%, var(--bg-dark) 100%);
    }
    .profile-icon {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid var(--accent-gold);
      box-shadow: 0 0 20px rgba(229, 185, 95, 0.4);
      object-fit: cover;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--accent-pink);
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .search-box {
      margin: 25px 0;
      display: flex;
      justify-content: center;
    }
    .search-input {
      width: 100%;
      max-width: 500px;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid var(--accent-gold);
      background-color: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .chapters {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .chapter-btn {
      background: var(--card-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .chapter-btn.active, .chapter-btn:hover {
      background: var(--accent-gold);
      color: var(--bg-dark);
      font-weight: bold;
    }
    .poem-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .poem-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(229, 185, 95, 0.2);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .poem-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      border-color: var(--accent-pink);
    }
    .poem-number {
      font-size: 0.8rem;
      color: var(--accent-gold);
    }
    .poem-title {
      font-size: 1.15rem;
      font-weight: bold;
      margin: 6px 0 10px;
    }
    .poem-preview {
      font-size: 0.9rem;
      color: var(--text-sub);
      white-space: pre-wrap;
      max-height: 80px;
      overflow: hidden;
      position: relative;
    }
    /* モーダル表示 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 18px;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-sub);
    }
    .modal-body {
      white-space: pre-wrap;
      line-height: 2;
      margin-top: 15px;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <header>
    <img src="icon.png" alt="公式恋愛詩人 咲華" class="profile-icon">
    <h1>公式恋愛詩人 咲華</h1>
    <p class="subtitle">〜 重複のない全篇校正版 公式詩集 〜</p>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="作品名や詩文から検索...">
    </div>

    <div class="chapters">
      <button class="chapter-btn active" onclick="filterChapter('all')">全篇</button>
      <button class="chapter-btn" onclick="filterChapter(1)">第1部 (0001〜0272)</button>
      <button class="chapter-btn" onclick="filterChapter(2)">第2部 (0273〜1056)</button>
      <button class="chapter-btn" onclick="filterChapter(3)">第3部 (1057〜1700)</button>
      <button class="chapter-btn" onclick="filterChapter(4)">第4部 (1701〜2183)</button>
    </div>

    <div id="poemList" class="poem-grid">
      <!-- 詩のカードがここに表示されます -->
    </div>
  </div>

  <div id="poemModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalNumber" class="poem-number"></div>
      <h2 id="modalTitle" class="poem-title" style="color: var(--accent-gold);"></h2>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    // サンプル作品データ（咲華詩集Dの校正版より）
    const poems = [
      { id: "0001", chapter: 1, title: "あのこのこ", text: "あのこのこ\nおいかけっこ\nあのこのこ\nどうしてなのか\nわかってた\nあのこのこ\nさびしかったんだね\nあのこのこ\nうれしかったんだね\nあのこのこ" },
      { id: "0002", chapter: 1, title: "きげん", text: "きげん\nわるいときや\nいいとき\nわたしがきげんいいとき\nおかしやだがしやさんで\nかってもらったとき\nじゃんけんにかったとき\nきげん\nわたしがきげんがわるいとき\nないてないて\nだれかのせいにしちゃったり\nわるくはないのに\nそうしちゃうの\nきげん\nわるくならないで\nきげん\nよくなってねわたし" },
      { id: "0003", chapter: 1, title: "おそら", text: "すいすいすい\nくもさん\nきんぎょさんのように\nすいすいおよいでる\nごろごろごろ\nくもさん\nおこってた\nおとうさんみたいに\nおこってた\nざーざー\nくもさん\nないてた\nわたしとおなじようにないてた\nかなしいのかな\nはれたそら\nあおくて\nきもちいいくうき\nくもさん\nどこかにいっちゃった\nにしへひがしへ\nいっちゃった" },
      { id: "0004", chapter: 1, title: "ちょうちょう", text: "おはなさんにちょうちょうが\nあっちのおはなさんにも\nあっちにもこっちにも\nいろんなところに\nちょうちょうがとまっていた\nわたしのまわりにも\nちょうちょうがとびまわっていた\nしろ、きいろ、あおむらさき\nいろとりどりのちょうちょう\nきれいだね\nちょうちょうのはね\nきれいだね" },
      { id: "0005", chapter: 1, title: "さんぽ", text: "さんぽ\nいつでも\nたのしいな\nさんぽさんぽ\nぼくのいるってこと\nそのあかしになる\nみちって\nすごいな\nさかをのぼって\nくだっては、\nきんじょのいぬにほえられて\nねこにはにゃーにゃー\nすずめにはちゅんちゅん\nみんなぼくにあいさつをしている\nさんぽ\nいつでも\nたのしいな" }
    ];

    let currentChapter = 'all';

    function renderPoems(list) {
      const container = document.getElementById('poemList');
      container.innerHTML = '';
      list.forEach(poem => {
        const card = document.createElement('div');
        card.className = 'poem-card';
        card.onclick = () => openModal(poem);
        card.innerHTML = `
          <div class="poem-number">【連番】${poem.id}（第${poem.chapter}部）</div>
          <div class="poem-title">${poem.title}</div>
          <div class="poem-preview">${poem.text}</div>
        `;
        container.appendChild(card);
      });
    }

    function filterChapter(ch) {
      currentChapter = ch;
      document.querySelectorAll('.chapter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      applyFilter();
    }

    document.getElementById('searchInput').addEventListener('input', applyFilter);

    function applyFilter() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = poems.filter(p => {
        const matchChapter = (currentChapter === 'all' || p.chapter === currentChapter);
        const matchQuery = !query || p.title.toLowerCase().includes(query) || p.text.toLowerCase().includes(query);
        return matchChapter && matchQuery;
      });
      renderPoems(filtered);
    }

    function openModal(poem) {
      document.getElementById('modalNumber').textContent = `【連番】${poem.id} / 第${poem.chapter}部`;
      document.getElementById('modalTitle').textContent = poem.title;
      document.getElementById('modalBody').textContent = poem.text;
      document.getElementById('poemModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('poemModal').style.display = 'none';
    }

    renderPoems(poems);
  </script>
</body>
</html>
